name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Free up disk space
      run: |
        echo "Attempting to free up space on runner..."
        sudo apt-get clean
        sudo apt-get autoremove -y
        pip cache purge
        # Removing large pre-installed software stacks that are likely unused for Python testing
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/bin/gh || true
        echo "Disk space cleared."

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        pytest tests/ --maxfail=1 --disable-warnings -q